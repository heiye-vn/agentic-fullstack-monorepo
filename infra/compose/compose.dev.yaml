name: autix-monorepo-dev

services:
  chat:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.chat
    command: pnpm --filter @autix/chat dev
    volumes:
      - ../../packages/contracts:/app/packages/contracts
      - ../../services/chat:/app/services/chat
      - /app/node_modules
      - /app/services/chat/node_modules
      - /app/services/chat/dist
    ports:
      - "4001:4001"
    environment:
      PORT: "4001"
      NODE_ENV: "development"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  chat-web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:4001"
    command: pnpm --filter @autix/chat-web dev
    volumes:
      - ../../packages/contracts:/app/packages/contracts
      - ../../clients/chat-web:/app/clients/chat-web
      - /app/node_modules
      - /app/clients/chat-web/node_modules
      - /app/clients/chat-web/.next
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4001"
    depends_on:
      chat:
        condition: service_healthy
