name: autix-monorepo

services:
  chat:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.chat
    ports:
      - "4001:4001"
    environment:
      PORT: "4001"
      NODE_ENV: "production"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  chat-web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:4001"
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4001"
    depends_on:
      chat:
        condition: service_healthy
    restart: unless-stopped
