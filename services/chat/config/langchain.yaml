# LangChain 运行参数配置（密钥/地址一律走 .env 环境变量）

llm:
  # 默认模型标识
  modelName: qwen3.8-max
  # 生成温度：0 = 确定性输出，1 = 高随机性
  temperature: 0
  # 单次最大生成 token 数
  maxTokens: 2048
  # 请求超时（毫秒）
  timeoutMs: 90000

retrieval:
  # 向量检索返回的最大文档数
  topK: 4
  # 相似度阈值（0~1）
  scoreThreshold: 0.75
  # Embedding 模型标识
  embeddingModel: text-embedding-3-small
  # 检索策略：simple = 纯向量；hybrid = 向量 + BM25 多召回 → RRF 融合 → embedding 重排
  # （第二十章 20.2，默认 hybrid；改回 simple 即可完全退回原有行为）
  mode: hybrid
  # 检索整体超时（毫秒）。检索是"锦上添花"，绝不能拖垮主链路：
  # embedding 模型首次下载、向量库不可达等场景下会「挂起」而不是抛错，
  # try/catch 挡不住挂起，只能靠硬超时兜底。超时即降级为空上下文，主链路继续
  timeoutMs: 8000

tools:
  # 是否启用 Web 搜索工具
  enableWebSearch: false
  # 是否启用代码解释器
  enableCodeInterpreter: false

features:
  # 是否启用流式输出
  streaming: true
  # 是否启用对话记忆
  memory: false
  # 记忆窗口大小（保留最近 N 轮对话）
  memoryWindowSize: 10
