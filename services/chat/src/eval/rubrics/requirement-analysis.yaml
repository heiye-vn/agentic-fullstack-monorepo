# 需求分析报告评分 rubric（版本化，在线 Critic 与离线 judge 共享同一份来源）
#
# 第十七章 17.5：rubric 外置的目的不是「少写几行 prompt」，
# 而是让线上评审标准和离线评测标准**不可能**分叉 ——
# 标准写死在代码 prompt 里时，改一次就得记得改两处，迟早漏。
#
# 这份文件有两个消费方，读的是不同 section：
#
#   dimensions       → 离线 judge 用（多维打分 → 代码算加权总分 → 过 gate）
#   criticChecklist  → 在线 criticNode 用（拼成 system prompt）
#                      ⚠️ 在线 critic 的输出契约是 {pass, critique, issues}，
#                      是 Critic-Refine 子图的控制流依赖，不能改成多维打分结构。
#                      所以这里给的是「检查项清单」而不是「维度+权重」。
#
# 修改本文件的注意事项：
#   1. version 必须递增，让历史评测结果能被追溯到当时用的是哪版标准
#   2. dimensions 的 weight 之和必须精确等于 1（rubric-loader 会校验，不等于直接抛错）
#   3. 动了 gate 就等于动了 CI 门禁线，请同步更新 Chapter 17 文档里的阈值说明

version: 1

# ---------------------------------------------------------------------------
# 在线 criticNode 的检查项（输出必须仍是 pass / critique / issues）
# 内容与 criticNode 原先内联的那四条标准一一对应，改写时请保持语义等价，
# 否则 chapter9 / chapter16 的既有断言可能翻车。
# ---------------------------------------------------------------------------
criticChecklist:
  - id: sections
    name: 章节完整性
    desc: 必须包含需求摘要、冲突分析、技术复杂度、开发排期四个章节
  - id: schedule-deps
    name: 排期依赖项
    desc: 排期章节必须标明各阶段的依赖关系（如「前端开发依赖后端 API 完成」）
  - id: conflict-solution
    name: 冲突解决方案
    desc: 存在冲突时必须给出具体解决方案，不能只描述问题
  - id: logic-consistency
    name: 逻辑一致性
    desc: 各章节之间不能有明显矛盾（如摘要说低复杂度，但技术分析提到大规模重构）

# ---------------------------------------------------------------------------
# 离线 judge 的评分维度（加权总分由代码算，不让 LLM 做算术）
# ---------------------------------------------------------------------------
dimensions:
  - id: completeness
    name: 完整性
    weight: 0.3
    desc: 是否覆盖功能分解、用户故事、验收标准、风险、排期依赖
  - id: professionalism
    name: 专业性
    weight: 0.25
    desc: 术语准确、分析有深度、无明显事实错误
  - id: actionability
    name: 可执行性
    weight: 0.25
    desc: 结论是否具体可落地，而非空泛套话
  - id: consistency
    name: 一致性
    weight: 0.2
    desc: 各章节结论不自相矛盾，冲突有解决方案

# ---------------------------------------------------------------------------
# 单份报告的合格线（与 JudgeResult.passed 对应的判定规则）
#   minScore        加权总分下限
#   minPerDimension 单维度下限，任一项低于此也判 fail ——
#                   防止「总分被拉高、但某个维度塌了」的报告蒙混过关
# ---------------------------------------------------------------------------
gate:
  minScore: 75
  minPerDimension: 60
